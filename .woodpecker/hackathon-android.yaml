labels:
  platform: windows/amd64
  backend: local

when:
  - event: manual
  - event: push
    branch:
      - main
      - chore/hackathon-woodpecker-ci

steps:
  - name: android-qa
    image: powershell.exe
    environment:
      ARTISYS_UTILIDADES_PATH: 'C:\VICTOR\Artisys\AgroFrota\utilidades'
      ARTISYS_HACKATHON_SECRETS_SOURCE: 'C:\Users\Marcio\StudioProjects\Hackathon'
      ARTISYS_HACKATHON_QA_ROOT: 'C:\VICTOR\Hackathon-QA\woodpecker'
      ANDROID_HOME: 'C:\Users\Marcio\AppData\Local\Android\Sdk'
    commands:
      - '$ErrorActionPreference = "Stop"'
      - '$env:CI = "true"'
      - 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\ci\hackathon-android-v4.ps1"'

  - name: reportar-sucesso-github
    image: powershell.exe
    environment:
      ARTISYS_UTILIDADES_PATH: 'C:\VICTOR\Artisys\AgroFrota\utilidades'
      ARTISYS_QA_REPORT_PATH: '.\artifacts\qa-summary.json'
      ARTISYS_LOG_PATH: '.\artifacts\woodpecker-hackathon-android.log'
      ARTISYS_STATUS_CONTEXT: 'ci/woodpecker/hackathon-android'
      ARTISYS_CI_RESULT: 'success'
    commands:
      - '$ErrorActionPreference = "Stop"'
      - '$reporter = Join-Path $env:ARTISYS_UTILIDADES_PATH "modules\artisys-ci-reporter\bin\artisys-ci-reporter.mjs"'
      - 'if (-not (Test-Path $reporter)) { git -C $env:ARTISYS_UTILIDADES_PATH pull --ff-only }'
      - 'node $reporter'
    when:
      - event: [push, manual]
        status: [success]

  - name: reportar-falha-github
    image: powershell.exe
    environment:
      ARTISYS_UTILIDADES_PATH: 'C:\VICTOR\Artisys\AgroFrota\utilidades'
      ARTISYS_QA_REPORT_PATH: '.\artifacts\qa-summary.json'
      ARTISYS_LOG_PATH: '.\artifacts\woodpecker-hackathon-android.log'
      ARTISYS_STATUS_CONTEXT: 'ci/woodpecker/hackathon-android'
      ARTISYS_FAILED_STEP: 'android-qa'
      ARTISYS_CI_RESULT: 'failure'
    commands:
      - '$ErrorActionPreference = "Continue"'
      - '$reporter = Join-Path $env:ARTISYS_UTILIDADES_PATH "modules\artisys-ci-reporter\bin\artisys-ci-reporter.mjs"'
      - 'if (-not (Test-Path $reporter)) { git -C $env:ARTISYS_UTILIDADES_PATH pull --ff-only }'
      - 'node $reporter'
    when:
      - event: [push, manual]
        status: [failure]
    failure: ignore
